<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile | Quiz Platform</title>
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <div class="app-header__inner">
      <div>
        <div class="app-header__title">Quiz Platform</div>
        <div class="app-header__role">Student Profile</div>
      </div>
      <a href="dashboard.html" class="btn btn--ghost">Back to Dashboard</a>
    </div>
  </header>

  <main class="app-main app-main--top">
    <div class="app-container app-card-page">
      <article class="card card--elevated" aria-labelledby="profile-title">
        <header class="card__header">
          <div class="card__meta">Student</div>
          <h1 id="profile-title" class="card__title">Profile & Credentials</h1>
          <p class="card__subtitle">This information represents the <code>Student</code> and related <code>User</code> credentials.</p>
        </header>
        <div class="card__body">
          <section class="list" aria-label="Student credentials">
            <div class="list__item list__item--muted">
              <strong>Full name:</strong> John Doe
            </div>
            <div class="list__item list__item--muted">
              <strong>Username:</strong> johndoe
            </div>
            <div class="list__item list__item--muted">
              <strong>Email:</strong> john.doe@example.com
            </div>
            <div class="list__item list__item--muted">
              <strong>Role:</strong> Student
            </div>
          </section>
        </div>
        <footer class="card__footer">
          <a href="dashboard.html" class="btn btn--secondary">Back</a>
          <a href="../auth/login.html" class="btn btn--primary">Logout</a>
        </footer>
      </article>
    </div>
  </main>

  <footer class="app-footer">
    &copy; <span>Quiz Platform</span>
  </footer>
</body>
</html>
